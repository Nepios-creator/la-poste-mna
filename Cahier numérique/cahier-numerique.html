<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Cahier numérique</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 10 10%22><text y=%228.5%22 font-size=%228%22>📓</text></svg>">
<style>
:root{--bg:#f4efe6;--ink:#2a2622;--card:#fffdf8;--line:#d9d2c3;--acc:#8a2b2b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a17;--ink:#eee8dc;--card:#26231f;--line:#3d3830;--acc:#e08a8a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1a17;--ink:#eee8dc;--card:#26231f;--line:#3d3830;--acc:#e08a8a;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
#app{max-width:640px;margin:auto;padding:0 14px 40px}
header{display:flex;align-items:center;gap:10px;padding:12px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
header h1{flex:1;font:600 18px Georgia,serif;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px;cursor:pointer}
button.p{background:var(--acc);color:#fff;border:0;width:100%;padding:12px;font-weight:600}
header button.p{width:auto;padding:7px 14px}
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cv{border-radius:6px 14px 14px 6px;border-left:8px solid rgba(0,0,0,.35);color:#fff;padding:14px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;cursor:pointer;box-shadow:2px 3px 8px rgba(0,0,0,.25)}
.cv b{font:700 17px Georgia,serif}.cv small,.cv span{opacity:.85;font-size:13px}
.cv.add{background:var(--card);color:var(--ink);border:2px dashed var(--line);align-items:center;justify-content:center;text-align:center;box-shadow:none}
.hint{color:var(--ink);opacity:.65;font-size:13px}
.f{display:grid;gap:12px;margin:10px 0}label{display:grid;gap:4px;font-size:14px}
input{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.sw{display:flex;gap:10px}.sw i{width:34px;height:34px;border-radius:50%;border:3px solid transparent}.sw i.on{border-color:var(--ink)}
.cover{color:#fff;border-radius:8px 18px 18px 8px;border-left:12px solid rgba(0,0,0,.35);padding:26px 20px;text-align:center;box-shadow:3px 4px 12px rgba(0,0,0,.3)}
.cover h2{font:700 26px Georgia,serif;margin:4px 0 18px}.cover small{letter-spacing:2px;opacity:.8;font-size:12px}.cover p{margin:0;font:20px Georgia,serif}
.pl{list-style:none;padding:0;margin:0}.pl li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.tb{display:flex;flex-wrap:wrap;gap:5px;padding:6px 0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);background:var(--bg);z-index:4}
.tb button{padding:5px 10px;min-width:36px}.tb .d{min-width:0;width:26px;height:26px;padding:0;border-radius:50%}
.meta{font-size:13px;opacity:.75;margin:4px 2px}
.sheet{background:#fffdf4;color:#222;border-left:4px double #e49a9a;border-radius:4px 10px 10px 4px;min-height:60vh;padding:0 14px;line-height:32px;outline:0;box-shadow:2px 3px 10px rgba(0,0,0,.2);transform-origin:left center;background-image:repeating-linear-gradient(transparent 0 31px,#d6e0ee 31px 32px);word-break:break-word}
.sheet h3{margin:0;line-height:32px;font-size:20px}.sheet ul,.sheet ol{margin:0;padding-left:24px}
.flip{animation:fl .45s ease-out}@keyframes fl{from{transform:perspective(900px) rotateY(-75deg);opacity:.2}to{transform:none;opacity:1}}
#t{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;display:none;z-index:9}
</style></head><body><div id="app"></div><div id="t"></div>
<script>
const K='cahier-num-v1';let D={c:[],bk:0};
try{D=JSON.parse(localStorage.getItem(K))||D}catch(e){}
let tm,st;const raw=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){toast('Enregistrement impossible sur cet appareil')}};
const save=()=>{const n=Date.now();[cur,pg].forEach(x=>{if(x){x.u=n;x.d=1}});raw();clearTimeout(st);st=setTimeout(()=>sync(),3000)};
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hm=t=>t?new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'…';
const dt=t=>new Date(t).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const toast=m=>{const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(tm);tm=setTimeout(()=>t.style.display='none',2500)};
const COL=['#8a2b2b','#1f4e79','#2e6b3f','#6b3f8a','#b5651d','#2b2b2b'];let cur=null,pg=null,armed=0;
function home(){cur=pg=null;const d=D.bk?'Dernière sauvegarde : '+dt(D.bk):'Aucune sauvegarde externe pour l’instant.';
app.innerHTML=`<header><h1>📓 Cahier numérique</h1><button onclick="menu()">⋯</button></header><div class=shelf>${D.c.filter(c=>!c.del).map(c=>`<div class=cv style="background:${c.color}" onclick="openB('${c.id}')"><small>${c.pages.length} page(s)</small><b>${esc(c.cours)}</b><span>${esc(c.prof)}</span></div>`).join('')}<div class="cv add" onclick="newB()"><div style="font-size:32px">＋</div>Nouveau cahier</div></div><p class=hint>${D.s?'☁️ Compte : '+esc(D.s.email)+'. '+(D.st||''):'Pas de compte : vos notes ne sont que sur cet appareil (⋯ pour activer la sauvegarde en ligne).'} Tout s’enregistre automatiquement sur cet appareil. Pour ne jamais rien perdre (même si le téléphone est perdu), utilisez ⋯ → Sauvegarder et envoyez le fichier vers Google Drive. ${d}</p>`}
function menu(){app.innerHTML=`<header><button onclick=home()>‹</button><h1>Sauvegarde</h1></header><div class=f>${acct()}<hr style="width:100%;border:0;border-top:1px solid var(--line)"><button class=p onclick="exp()">Sauvegarder tous mes cahiers</button><label>Restaurer une sauvegarde<input type=file accept=".json,application/json" onchange="imp(this)"></label><button onclick="th()">Changer le thème clair / sombre</button><p class=hint>Le fichier de sauvegarde contient tous vos cahiers. Enregistrez-le dans Google Drive : sur un nouveau téléphone, il suffit de le restaurer ici.</p></div>`}
function th(){const r=document.documentElement;r.dataset.theme=r.dataset.theme=='dark'?'light':'dark'}
async function exp(list,n){const f=new File([JSON.stringify({v:1,c:list||D.c})],(n||'cahiers')+'-'+new Date().toISOString().slice(0,10)+'.json',{type:'application/json'});
D.bk=Date.now();raw();try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name=='AbortError')return}
const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click();toast('Fichier téléchargé')}
function imp(i){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);let n=0;j.c.forEach(c=>{const e=D.c.find(x=>x.id==c.id);if(!e){c.d=1;c.u=c.u||Date.now();c.pages.forEach(p=>{p.d=1;p.u=p.u||Date.now()});D.c.push(c);n++}else c.pages.forEach(p=>{if(!e.pages.find(x=>x.id==p.id)){p.d=1;p.u=p.u||Date.now();e.pages.push(p);n++}})});save();toast(n+' élément(s) restauré(s)');home()}catch(e){toast('Fichier invalide')}};r.readAsText(i.files[0])}
function newB(){app.innerHTML=`<header><button onclick=home()>‹</button><h1>Nouveau cahier</h1></header><div class=f><label>Nom du cours<input id=a></label><label>Nom du professeur<input id=b></label><label>Couleur de la couverture<div class=sw>${COL.map((x,i)=>`<i style="background:${x}" data-c="${x}" onclick="pick(this)" class="${i?'':'on'}"></i>`).join('')}</div></label><button class=p onclick=mk()>Créer le cahier</button></div>`}
function pick(e){document.querySelectorAll('.sw i').forEach(i=>i.classList.remove('on'));e.classList.add('on')}
function mk(){const a=$('#a').value.trim();if(!a)return toast('Indiquez le nom du cours');D.c.unshift({u:Date.now(),d:1,id:uid(),cours:a,prof:$('#b').value.trim(),color:$('.sw .on').dataset.c,pages:[]});save();home()}
function openB(id){cur=D.c.find(c=>c.id==id);pg=null;armed=0;app.innerHTML=`<header><button onclick=home()>‹</button><h1>Cahier</h1><button onclick="exp([cur],cur.cours)">Partager</button><button id=del onclick="delB(this)">🗑</button></header><div class=cover style="background:${cur.color}"><small>COURS</small><h2>${esc(cur.cours)}</h2><small>PROFESSEUR</small><p>${esc(cur.prof||'—')}</p></div><div class=f><button class=p onclick=newP()>＋ Nouvelle page</button></div><ul class=pl>${cur.pages.map((p,i)=>`<li onclick="openP('${p.id}')"><b>Page ${i+1}</b> · ${esc(p.chap||'Sans chapitre')}<br><small>${esc(p.sujet||'')} — ${dt(p.start)}, ${hm(p.start)}–${hm(p.end)}${p.end?'':' (en cours)'}</small></li>`).join('')||'<li class=hint>Aucune page pour l’instant.</li>'}</ul>`}
function delB(b){if(!armed){armed=1;b.textContent='Confirmer ?';return}cur.del=1;save();home()}
function newP(){app.innerHTML=`<header><button onclick="openB('${cur.id}')">‹</button><h1>Nouvelle page</h1></header><div class=f><label>Chapitre du cours<input id=a></label><label>Sous-sujet<input id=b></label><p class=hint>L’heure de début est enregistrée automatiquement (${hm(Date.now())}). L’heure de fin le sera à la fermeture de la page.</p><button class=p onclick=go()>Commencer à écrire</button></div>`}
function go(){const p={id:uid(),chap:$('#a').value.trim(),sujet:$('#b').value.trim(),start:Date.now(),end:0,html:''};cur.pages.push(p);pg=p;save();draw(1,1)}
function openP(id){pg=cur.pages.find(p=>p.id==id);draw(!pg.end?1:0,1)}
const B=(c,l,v)=>`<button onpointerdown="event.preventDefault()" onclick="cmd('${c}',${v?`'${v}'`:'null'})">${l}</button>`;
const DOT=(c,x)=>`<button class=d style="background:${x}" onpointerdown="event.preventDefault()" onclick="cmd('${c}','${x}')"></button>`;
const TB='<div class=tb>'+B('bold','<b>G</b>')+B('italic','<i>I</i>')+B('underline','<u>S</u>')+B('strikeThrough','<s>B</s>')+B('formatBlock','Titre','h3')+B('insertUnorderedList','•')+B('insertOrderedList','1.')+B('justifyLeft','⇤')+B('justifyCenter','↔')+['#c0392b','#1f4e79','#2e6b3f','#b5651d','#222222'].map(x=>DOT('foreColor',x)).join('')+['#fff176','#a5d6a7','#90caf9','#f8bbd0'].map(x=>DOT('hiliteColor',x)).join('')+B('removeFormat','✕')+B('undo','↶')+'</div>';
function draw(ed,fl){const i=cur.pages.indexOf(pg)+1;
app.innerHTML=`<header><button onclick="closeP()">${ed?'✕':'‹'}</button><h1>${esc(cur.cours)} · p.${i}</h1>${ed?'<button class=p onclick=closeP()>Fermer</button>':'<button onclick="draw(1)">Corriger</button>'}</header>${ed?TB:''}<div class=meta><b>${esc(pg.chap||'Sans chapitre')}</b> — ${esc(pg.sujet||'')}<br>${dt(pg.start)} · ${hm(pg.start)} → ${hm(pg.end)}</div><div class="sheet${fl?' flip':''}" id=ed${ed?' contenteditable':''}>${pg.html}</div>`;
if(ed){document.execCommand('styleWithCSS',false,true);const e=$('#ed');let t;e.oninput=()=>{pg.html=e.innerHTML;clearTimeout(t);t=setTimeout(save,400)};if(!pg.html)e.focus()}}
function cmd(c,v){document.execCommand(c,false,v);const e=$('#ed');pg.html=e.innerHTML;save()}
function closeP(){const e=$('#ed');if(e&&e.isContentEditable)pg.html=e.innerHTML;if(!pg.end)pg.end=Date.now();save();openB(cur.id)}
document.addEventListener('visibilitychange',()=>{const e=$('#ed');if(pg&&e&&e.isContentEditable){pg.html=e.innerHTML;save()}else if(!document.hidden)sync()});addEventListener('online',()=>sync());

const SB='https://aehxiexsotqpmnmsfwgq.supabase.co',KEY='sb_publishable_4x9NR7lwOhWvvL4Um-WTAA_756gELy4';
async function api(p,o={},au=1){const h={apikey:KEY,'Content-Type':'application/json',...(o.h||{})};if(au&&D.s)h.Authorization='Bearer '+D.s.access_token;const r=await fetch(SB+p,{method:o.m||'GET',headers:h,body:o.b?JSON.stringify(o.b):undefined});const t=await r.text();let j;try{j=JSON.parse(t)}catch(e){j=t}if(!r.ok)throw j;return j}
const stat=m=>{D.st=m;raw()};
const acct=()=>D.s?`<p><b>☁️ ${esc(D.s.email)}</b></p><p class=hint>${D.st||''}</p><button class=p onclick="sync().then(menu)">Synchroniser maintenant</button><button onclick="out()">Se déconnecter</button>`:`<p><b>☁️ Sauvegarde en ligne</b></p><label>E-mail<input id=em type=email></label><label>Mot de passe (6 caractères min.)<input id=pw type=password></label><button class=p onclick="auth(1)">Se connecter</button><button onclick="auth(0)">Créer un compte</button>`;
function out(){D.s=null;raw();menu()}
function setS(j){D.s={access_token:j.access_token,refresh_token:j.refresh_token,exp:Date.now()+j.expires_in*1000-60000,email:j.user.email}}
async function auth(login){const em=$('#em').value.trim(),pw=$('#pw').value;if(!em||pw.length<6)return toast('E-mail et mot de passe (6 caractères min.)');
try{const j=await api(login?'/auth/v1/token?grant_type=password':'/auth/v1/signup',{m:'POST',b:{email:em,password:pw}},0);if(!j.access_token)return toast('Compte créé : confirmez votre e-mail, puis connectez-vous');setS(j);D.c.forEach(c=>{c.d=1;c.u=c.u||Date.now();c.pages.forEach(p=>{p.d=1;p.u=p.u||Date.now()})});raw();await sync();menu()}catch(e){toast(e.msg||e.error_description||e.message||'Échec de connexion')}}
async function tok(){if(Date.now()>D.s.exp){setS(await api('/auth/v1/token?grant_type=refresh_token',{m:'POST',b:{refresh_token:D.s.refresh_token}},0));raw()}}
let busy=0;async function sync(){if(!D.s||busy||!navigator.onLine)return;busy=1;try{await tok();
const [rc,rp]=await Promise.all([api('/rest/v1/cn_cahiers?select=*'),api('/rest/v1/cn_pages?select=*')]);
rc.forEach(r=>{let c=D.c.find(x=>x.id==r.id);if(!c){c={id:r.id,pages:[],u:0};D.c.push(c)}if(r.updated_at>(c.u||0))Object.assign(c,{cours:r.cours,prof:r.prof,color:r.color,del:r.deleted,u:r.updated_at,d:0})});
rp.forEach(r=>{const c=D.c.find(x=>x.id==r.cahier_id);if(!c)return;let p=c.pages.find(x=>x.id==r.id);if(!p){p={id:r.id,u:0};c.pages.push(p)}if(r.updated_at>(p.u||0))Object.assign(p,{chap:r.chap,sujet:r.sujet,start:r.start_at,end:r.end_at,html:r.html,u:r.updated_at,d:0})});
D.c.forEach(c=>c.pages.sort((a,b)=>a.start-b.start));
const cs=D.c.filter(c=>c.d),ps=[];D.c.forEach(c=>c.pages.forEach(p=>{if(p.d)ps.push([c,p])}));
const up=(t,b)=>b.length&&api('/rest/v1/'+t+'?on_conflict=id',{m:'POST',h:{Prefer:'resolution=merge-duplicates,return=minimal'},b});
await up('cn_cahiers',cs.map(c=>({id:c.id,cours:c.cours,prof:c.prof||'',color:c.color,deleted:!!c.del,updated_at:c.u||Date.now()})));
await up('cn_pages',ps.map(([c,p])=>({id:p.id,cahier_id:c.id,chap:p.chap||'',sujet:p.sujet||'',start_at:p.start,end_at:p.end||0,html:p.html||'',updated_at:p.u||Date.now()})));
cs.forEach(c=>c.d=0);ps.forEach(([c,p])=>p.d=0);stat('Synchronisé à '+hm(Date.now()));raw();if($('.shelf'))home()}
catch(e){stat('Hors ligne ou erreur : sera réessayé');if(e&&e.code==401)D.s=null}finally{busy=0}}
home();sync();
</script></body></html>
