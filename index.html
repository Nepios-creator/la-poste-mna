 hs().innerHTML=doorCard()+ks.map(([k,l])=>`<div class=card><h3>Mon programme fixe ${l}</h3>`+list((data||[]).filter(s=>s.kind==k).map(s=>`<div class=card>${esc(s.days.join(', '))} · ${esc(s.heure)}<br><span class=m>Avec : ${esc(s.compagnon||'—')}</span><br><button class=r data-a=scdel data-v=${s.id}>Supprimer</button></div>`),'<p class=m>Aucun programme enregistré.</p>')+`<form data-k=${k}><b>Ajouter un créneau</b><br>${DJ.map(d=>`<label><input class=ck type=checkbox name=d value=${d}>${d}</label><br>`).join('')}<label class=m>Heure</label><input type=time name=h required><input name=c placeholder="Compagnon (nom)" required value="${k=='terrain'&&partnerId()?esc(nmOf(partnerId())):''}"><button>Ajouter</button></form></div>`).join('');
 if($('#df'))$('#df').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);if(!await yes('Enregistrer '+f.get('n')+' portes ?',PREC[f.get('p')]+'\nCe nombre ne pourra plus être modifié.'))return;const u={door_count:+f.get('n'),door_precision:f.get('p')},{error}=await sb.from('pm_profiles').update(u).eq('id',me.id);error?alert(error.message):(Object.assign(me,u),schedView())};
 hs().querySelectorAll('form[data-k]').forEach(fm=>fm.onsubmit=async e=>{e.preventDefault();const f=new FormData(fm),days=f.getAll('d');if(!days.length)return alert('Choisissez au moins un jour.');
  const{error}=await sb.from('pm_schedules').insert({days,heure:f.get('h'),compagnon:f.get('c').trim(),user_id:me.id,kind:fm.dataset.k});error?alert(error.message):schedView()})}
H.scdel=async v=>{if(await yes('Supprimer ce créneau ?')){await sb.from('pm_schedules').delete().eq('id',v);schedView()}};
async function schedAll(){const d=(await sb.from('pm_schedules').select('*').order('user_name')).data||[],g={};d.forEach(s=>(g[s.user_name+'|'+s.kind]??=[]).push(s));
 const pr=d.length?(await sb.from('pm_profiles').select('id,door_count,door_precision').in('id',[...new Set(d.map(s=>s.user_id))])).data||[]:[],PD=Object.fromEntries(pr.map(p=>[p.id,p]));
 hs().innerHTML='<h3>Programmes de la zone</h3>'+list(Object.values(g).map(a=>`<div class=card><b>${esc(a[0].user_name)}</b> <span class=tag>${a[0].kind=='terrain'?'Terrain':'Cellule'}</span> <span class=m>${esc(zn(a[0].zone_id))}</span>${a[0].kind=='terrain'&&PD[a[0].user_id]?.door_count!=null?`<br>🚪 ${PD[a[0].user_id].door_count} portes <span class=tag>${esc(PREC[PD[a[0].user_id].door_precision]||'')}</span>`:''}${a.map(s=>`<br>${esc(s.days.join(', '))} · ${esc(s.heure)} · avec ${esc(s.compagnon||'—')}`).join('')}</div>`),'<p class=m>Aucun programme soumis pour le moment.</p>')}

/* ---------- Administration ---------- */
function admView(){const t=[['mem','Membres',can('members')],['req','Demandes de modification',can('members')],['adm','Administrateurs',can('admins')],['zon','Zones',can('zones')]].filter(x=>x[2]);
 if(!t.length)return hs().innerHTML='<div class=card>Aucun droit d’administration attribué pour le moment.</div>';
 if(!t.find(x=>x[0]==asub))asub=t[0][0];
 hs().innerHTML=`<div class=tabs>${t.map(([k,l])=>`<button class="${asub==k?'on':''}" data-a=asub data-v=${k}>${l}</button>`).join('')}</div><div id=ab></div>`;
 ({mem:memList,req:reqList,adm:admList,zon:zonList})[asub]()}
async function memList(){const o={pending:0,active:1,blocked:2},d=((await sb.from('pm_profiles').select('*').neq('role_type','admin').neq('status','archived')).data||[]).sort((a,b)=>o[a.status]-o[b.status]);
 const xs=p=>`<select data-f=extra_role><option value="">Aucun rôle supplémentaire</option><option value=binome ${p.extra_role=='binome'?'selected':''}>Aussi : Évangéliste (binôme)</option><option value=berger_poste ${p.extra_role=='berger_poste'?'selected':''}>Aussi : Berger de Poste</option></select>`;
 $('#ab').innerHTML=list(d.map(p=>`<div class=card data-id=${p.id} data-st=${p.status} data-r=${p.role_type} data-z="${p.zone_id||''}"><b>${esc(p.full_name)}</b> <span class=tag>${{pending:'En attente',active:'Actif',blocked:'Bloqué'}[p.status]}</span><br><span class=m>${esc(p.email)} · ${esc(p.phone||'')} · ${esc(p.unit||'')}${p.identity_done?'':' · identité non remplie'}</span>${p.identity_done?idHtml(p):''}
 ${p.status=='pending'?`<select data-f=role_type>${['binome','serviteur','berger_poste','zone_lead'].map(r=>`<option value=${r} ${p.role_type==r?'selected':''}>${ROLES[r]}</option>`).join('')}</select><select data-f=zone_id><option value="">— zone —</option>${zones.map(z=>`<option value=${z.id} ${p.zone_id==z.id?'selected':''}>${esc(z.name)}</option>`).join('')}</select>${xs(p)}
  <button data-a=mact data-v=active>Valider</button> <button class=r data-a=mdel>Supprimer</button>`
 :`<div class=ins>Poste actuel : <b>${ROLES[p.role_type]}</b> · zone <b>${esc(zn(p.zone_id)||'—')}</b><br><span class=m>depuis le ${new Date(p.post_since).toLocaleDateString('fr')}</span></div>${xs(p)}
  <button data-a=mact data-v=active>${p.status=='blocked'?'Débloquer':'Enregistrer'}</button> ${p.status=='active'?'<button class=g data-a=mut>↔ Muter</button> <button class=s data-a=mact data-v=blocked>Bloquer</button>':''} <button class=s data-a=mpw>🔑 Mot de passe provisoire</button> <button class=r data-a=mrem>Retirer le compte</button>`}</div>`),'<p class=m>Aucun membre.</p>');imgs($('#ab'))}
H.mact=async(v,b)=>{const c=b.closest('[data-id]'),st=c.dataset.st,q=f=>c.querySelector('[data-f='+f+']');let x=q('extra_role')?.value||null;
 if(st=='pending'){const u={status:'active',role_type:q('role_type').value,zone_id:q('zone_id').value||null,extra_role:x};if(x==u.role_type)u.extra_role=null;if(!u.zone_id)return alert('Choisissez une zone.');
  const{error}=await sb.from('pm_profiles').update(u).eq('id',c.dataset.id);if(error)return alert(error.message);alert('Compte validé ✓');return memList()}
 if(x==c.dataset.r)x=null;
 const{error}=await sb.from('pm_profiles').update(v=='blocked'?{status:'blocked'}:{status:'active',extra_role:x}).eq('id',c.dataset.id);if(error)return alert(error.message);
 alert(v=='blocked'?'Compte bloqué ✓':st=='blocked'?'Compte débloqué ✓':'Enregistré ✓');memList()};
H.mut=async(v,b)=>{const c=b.closest('[data-id]'),r0=c.dataset.r,z0=c.dataset.z;
 const res=await askForm('↔ Muter vers un autre poste',`<p class=m>Poste actuel : <b>${ROLES[r0]}</b> · zone <b>${esc(zn(z0)||'—')}</b></p><label class=m>Nouveau poste</label><select id=mr>${['binome','serviteur','berger_poste','zone_lead'].map(r=>`<option value=${r} ${r==r0?'selected':''}>${ROLES[r]}</option>`).join('')}</select><label class=m>Nouvelle zone</label><select id=mz>${zones.map(z=>`<option value=${z.id} ${z.id==z0?'selected':''}>${esc(z.name)}</option>`).join('')}</select><label class=m>Rôle supplémentaire (facultatif)</label><select id=mx><option value="">Aucun</option><option value=binome>Aussi : Évangéliste (binôme)</option><option value=berger_poste>Aussi : Berger de Poste</option></select><div class=ins>Les rapports de son ancien poste restent archivés ; son nouveau poste démarre vide.</div><textarea id=mq rows=3 placeholder="Motif de la mutation (obligatoire)"></textarea>`,'Muter',d=>{const r=d.querySelector('#mr').value,z=d.querySelector('#mz').value,x=d.querySelector('#mx').value||null,q=d.querySelector('#mq').value.trim();
  if(r==r0&&z==z0)return 'Choisissez un nouveau poste ou une nouvelle zone.';if(!q)return 'Le motif est obligatoire.';return{r,z,x:x==r?null:x,q}});
 if(!res)return;const{error}=await sb.rpc('pm_transfer_member',{uid:c.dataset.id,p_role:res.r,p_extra:res.x,p_zone:res.z,p_reason:res.q});if(error)return alert('Mutation impossible : '+error.message);alert('Mutation enregistrée ✓');memList()};
H.mpw=async(v,b)=>{const c=b.closest('[data-id]'),name=c.querySelector('b')?.textContent||'ce membre';
 if(!await yes('Générer un mot de passe provisoire ?',name+' sera déconnecté(e) et devra choisir un nouveau mot de passe à sa prochaine connexion. Vérifiez bien son identité avant de lui transmettre le code.'))return;
 const{data,error}=await sb.rpc('pm_reset_password',{uid:c.dataset.id});if(error)return alert('Impossible : '+error.message);
 await askForm('🔑 Mot de passe provisoire',`<p>Pour <b>${esc(name)}</b> :</p><div class=ins style="font-size:28px;letter-spacing:4px;text-align:center;font-weight:700">${esc(data)}</div><p class=m>Transmettez-le par WhatsApp. Il ne sera plus affiché.</p><button type=button class=s onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(data)}');this.textContent='Copié ✓'">📋 Copier</button>`,'Terminé',()=>true)};
H.mrem=async(v,b)=>{const c=b.closest('[data-id]'),reason=await ask('Retirer ce compte',{text:'La personne ne pourra plus se connecter. Ses rapports et son identité sont conservés dans les Archives ; une autre personne pourra reprendre le poste.',input:true,ph:'Motif du retrait (obligatoire)',ok:'Retirer'});
 if(!reason)return;
 const{error}=await sb.rpc('pm_remove_member',{uid:c.dataset.id,p_reason:reason});if(error)return alert('Retrait impossible : '+error.message);alert('Compte retiré ✓ Ses rapports sont dans les Archives.');memList()};
H.mdel=async(v,b)=>{if(!await yes('Supprimer cette inscription (jamais validée) ?'))return;const{error}=await sb.rpc('pm_delete_member',{uid:b.closest('[data-id]').dataset.id});error?alert(error.message):memList()};
async function admList(){const d=(await sb.from('pm_profiles').select('*').order('full_name')).data||[],ad=d.filter(p=>p.role_type=='admin'),cd=d.filter(p=>p.role_type!='admin'&&p.status=='active');
 $('#ab').innerHTML=`<div class=card><b>Nommer un administrateur</b><select id=nc>${cd.map(p=>`<option value=${p.id}>${esc(p.full_name)} · ${esc(p.email)}</option>`).join('')}</select><button data-a=nadm>Nommer</button><p class=m>La personne doit d'abord s'être inscrite et avoir été validée comme membre. Vous réglez ensuite ses accès.</p></div>`+
 ad.map(p=>`<div class=card data-id=${p.id}><b>${esc(p.full_name)}</b> ${p.is_super?'<span class=tag>Compte principal</span>':''}<br><span class=m>${esc(p.email)}</span>${p.is_super?'<p class=m>Tous les accès.</p>':`<p>${Object.entries(PL).map(([k,l])=>`<label><input class=ck type=checkbox data-p=${k} ${p.perms?.[k]?'checked':''} ${k=='archives'&&!me.is_super?'disabled':''}>${l}</label><br>`).join('')}</p><p class=m>Zones accessibles (aucune cochée = toutes) :</p>${zones.map(z=>`<label><input class=ck type=checkbox data-z=${z.id} ${p.scope_zones?.includes(z.id)?'checked':''}>${esc(z.name)}</label><br>`).join('')}<br><button data-a=aSave>Enregistrer</button> <button class=s data-a=mpw>🔑 Mot de passe provisoire</button> <button class=r data-a=aOff>Retirer les droits</button>`}</div>`).join('')}
H.nadm=async()=>{const id=$('#nc').value;if(!id)return;const{error}=await sb.from('pm_profiles').update({role_type:'admin',status:'active',perms:{}}).eq('id',id);error?alert(error.message):admList()};
H.aSave=async(v,b)=>{const c=b.closest('[data-id]'),perms={};c.querySelectorAll('[data-p]').forEach(i=>perms[i.dataset.p]=i.checked);const z=[...c.querySelectorAll('[data-z]:checked')].map(i=>i.dataset.z);
 const{error}=await sb.from('pm_profiles').update({perms,scope_zones:z.length?z:null}).eq('id',c.dataset.id);alert(error?error.message:'Accès enregistrés ✓')};
H.aOff=async(v,b)=>{if(!await yes("Retirer les droits d'administration ?"))return;const{error}=await sb.from('pm_profiles').update({role_type:'serviteur',perms:{},scope_zones:null}).eq('id',b.closest('[data-id]').dataset.id);error?alert(error.message):admList()};
function zonList(){$('#ab').innerHTML=`<div class=card><form id=zf><input name=n placeholder="Nom de la nouvelle zone" required><button>Ajouter</button></form></div>`+zones.map(z=>`<div class=card data-id=${z.id}><input value="${esc(z.name)}"><button data-a=zren>Renommer</button> <button class=r data-a=zdel>Supprimer</button></div>`).join('');
 $('#zf').onsubmit=async e=>{e.preventDefault();const{error}=await sb.from('pm_zones').insert({name:new FormData(e.target).get('n').trim()});error?alert(error.message):rz()}}
const rz=async()=>{await loadZ();zonList()};
H.zren=async(v,b)=>{const c=b.closest('[data-id]'),{error}=await sb.from('pm_zones').update({name:c.querySelector('input').value.trim()}).eq('id',c.dataset.id);error?alert(error.message):rz()};
H.zdel=async(v,b)=>{if(!await yes('Supprimer cette zone ?'))return;const{error}=await sb.from('pm_zones').delete().eq('id',b.closest('[data-id]').dataset.id);error?alert('Suppression impossible : '+error.message):rz()};
sb.auth.onAuthStateChange(ev=>{if(ev=='SIGNED_OUT'){me=null;boot()}});boot();
</script></body></html>
